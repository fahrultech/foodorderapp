# CD — build both app images and publish them to GHCR on version tags.
#
#   push of tag v*   -> build api + web images, push to ghcr.io/<repo>/foodorder-{api,web}
#                       tagged <version>, <major>.<minor>, and sha-<short> (+ latest
#                       via the semver flavor). Auth = the built-in GITHUB_TOKEN
#                       with packages:write — NO new secrets to configure, and the
#                       token never appears in the file.
#   workflow_dispatch -> build only, no push (used to verify the workflow itself).
#
# The repo is public, so packages published with GITHUB_TOKEN from Actions are
# publicly pullable: docker pull ghcr.io/<owner>/<repo>/foodorder-api:<version>
name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    name: ${{ matrix.app }} image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, web]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata (names, tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/foodorder-${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Build${{ github.event_name == 'push' && ' + push to GHCR' || ' only (no push)' }}"
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # harmless (ignored with a warning) for the api image; the web
          # Dockerfile bakes NEXT_PUBLIC_API_URL in at build time
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:4000/api' }}
