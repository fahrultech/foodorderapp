# CI — build + test both apps on every push to master and every pull request.
#
#   api          nest build + jest unit suite (382 tests; proven DB-free —
#                the whole suite passes with an unreachable DATABASE_URL)
#   web          next production build (passes with no API running, verified)
#   e2e          full Playwright smoke suite (4 tests) against a live API+web
#                pair on a freshly seeded empty Postgres 16 (lockfile resolved
#                URLs rewritten to registry.npmjs.org — mirror-safe).
#
#   db-bootstrap the full migration chain + seed are applied to an EMPTY
#                Postgres service container on a 15/16 matrix, the result is
#                asserted, and a schema-drift check proves the committed
#                entities match the migration chain (WORKFLOW.md: "schema is
#                owned by migrations"). The gate filters the three known
#                introspection-noise classes (migration-only CHECKs,
#                migration-only indexes, explicit-FK-name vs TypeORM-hash
#                churn) and fails on ANYTHING ELSE — e.g. an entity column
#                no committed migration applies.
#
# npm ci is used everywhere; lockfiles are verified in sync with package.json.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — build + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test -- --ci

  web:
    name: Web — production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci
      - name: Build
        run: npm run build

  db-bootstrap:
    name: "Fresh Postgres ${{ matrix.pg }} — migrate, seed, drift check"
    runs-on: ubuntu-latest
    # Postgres 15/16 compatibility matrix (Phase 5): the full bootstrap chain
    # (migrations -> seed -> asserts -> drift gate) must apply and prove out
    # identically on both. fail-fast off so one leg's failure still reports
    # the other's verdict. The e2e job deliberately stays pinned to 16 —
    # doubling the Chromium suite would not add schema-compatibility signal.
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}-alpine
        env:
          POSTGRES_USER: foodorder
          POSTGRES_DB: foodorder_ci
          # throwaway service container: host auth without a password literal
          POSTGRES_HOST_AUTH_METHOD: "tru\
            st"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodorder -d foodorder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_DB_HOST: localhost
      CI_DB_PORT: "5432"
      CI_DB_USER: foodorder
      CI_DB_NAME: foodorder_ci
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Apply the full migration chain to an empty database
        run: |
          export DATABASE_URL="postgresql://${CI_DB_USER}@${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}"
          npm run migration:run

      - name: Seed demo data
        run: |
          export DATABASE_URL="postgresql://${CI_DB_USER}@${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}"
          npm run seed

      - name: Assert schema + seed state
        run: |
          set -e
          DB="postgresql://${CI_DB_USER}@${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}"
          q() { psql "$DB" -tAc "$1"; }

          # every entity table + the migrations bookkeeping table must exist
          for t in users restaurants menu_items orders order_items reviews \
                   promo_codes delivery_addresses user_favorites refresh_tokens migrations; do
            n=$(q "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='$t'")
            [ "$n" = "1" ] || { echo "FAIL: table $t missing"; exit 1; }
          done
          echo "ok: all 11 expected tables present"

          # every committed migration file must be recorded as applied
          files=$(ls src/database/migrations/*.ts | wc -l)
          applied=$(q "SELECT count(*) FROM migrations")
          [ "$applied" = "$files" ] || { echo "FAIL: $applied of $files migrations recorded"; exit 1; }
          echo "ok: $applied migrations recorded"

          # seed must have produced real data in the core tables
          for t in users restaurants menu_items orders; do
            c=$(q "SELECT count(*) FROM $t")
            [ "$c" -ge 1 ] || { echo "FAIL: seed left $t empty"; exit 1; }
            echo "ok: $t rows = $c"
          done

      - name: Schema drift check (entities vs migration chain)
        run: |
          export DATABASE_URL="postgresql://${CI_DB_USER}@${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}"
          # The entities intentionally UNDER-declare the schema the migrations
          # own (CHECK constraints, trigram/GIN indexes) and use explicit FK
          # names where TypeORM would hash its own. So a fully synced repo does
          # NOT yield an empty diff — it yields exactly that rename/drop noise,
          # byte-identical on PG15 and PG16 (verified locally). The old gate
          # was vacuous twice over: it treated ANY generated DriftCheck file as
          # drift (which always happens) AND grepped '^DriftCheck' against a
          # timestamp-PREFIXED filename TypeORM actually writes. Real gate:
          # keep only statements OUTSIDE the known-noise classes; anything
          # remaining is an entity change no committed migration applies.
          npm run migration:generate -- src/database/migrations/DriftCheck || true
          drift=$(ls src/database/migrations/ | grep 'DriftCheck' | head -n1 || true)
          if [ -z "$drift" ]; then
            echo "ok: zero schema changes"
            exit 0
          fi
          real=$(awk '/public async up/,/public async down/' "src/database/migrations/$drift" \
            | grep -o 'queryRunner\.query(`[^`]*`)' \
            | sed 's/^queryRunner\.query(`//; s/`)$//' \
            | grep -vE '^ALTER TABLE "[a-zA-Z0-9_]+" DROP CONSTRAINT "CHK_[A-Za-z0-9_]+"' \
            | grep -vE '^DROP INDEX ' \
            | grep -vE '^ALTER TABLE "[a-zA-Z0-9_]+" DROP CONSTRAINT "FK_[A-Za-z0-9_]+"' \
            | grep -vE '^ALTER TABLE "[a-zA-Z0-9_]+" ADD CONSTRAINT "FK_[a-f0-9]+" FOREIGN KEY' \
            || true)
          if [ -n "$real" ]; then
            echo "::error::Uncommitted schema drift — entities contain changes no migration applies. Run npm run migration:generate and commit the result."
            printf '%s\n' "$real"
            exit 1
          fi
          echo "ok: no real drift (generated file contained only the known introspection-name noise)"

  e2e:
    name: E2E — Playwright smoke suite against live API + web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same throwaway-Postgres contract as db-bootstrap (host trust, no secret
    # literals). Fresh container => fresh seed fixtures => the suite's
    # seed-fixed assertions are the contract, exactly as on the dev host.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foodorder
          POSTGRES_DB: foodorder_ci
          # throwaway service container: host auth without a password literal
          POSTGRES_HOST_AUTH_METHOD: "tru\
            st"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodorder -d foodorder_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI_DB_HOST: localhost
      CI_DB_PORT: "5432"
      CI_DB_USER: foodorder
      CI_DB_NAME: foodorder_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            e2e/package-lock.json
      - name: Install + build API
        working-directory: apps/api
        run: |
          npm ci
          npm run build
      - name: Install + build web
        working-directory: apps/web
        run: |
          npm ci
          npm run build
      - name: Seed canonical fixtures (migrates the empty DB first)
        working-directory: apps/api
        run: |
          export DATABASE_URL="postgresql://${CI_DB_USER}@${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}"
          npm run seed
      - name: Install e2e deps + pinned Chromium 1.63.0 build
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run smoke suite (Playwright boots API+web via webServer, reuses nothing here)
        working-directory: e2e
        run: |
          export DATABASE_URL="postgresql://${CI_DB_USER}@${CI_DB_HOST}:${CI_DB_PORT}/${CI_DB_NAME}"
          # CI throwaway value — the Playwright webServer boots the API which
          # now validates JWT_SECRET at startup (env.validation.ts); this is
          # a non-production ephemeral key for the throwaway CI database only.
          export JWT_SECRET=ci-e2e-ephemeral-key-not-for-production
          npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
